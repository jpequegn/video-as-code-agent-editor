[project]
name = "vace-media"
version = "0.1.0"
description = "Deterministic media analysis helpers for video-as-code-agent-editor"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
vace-media-analyze = "vace_media.analyze:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.10",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
